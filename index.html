<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لعبة التعاون</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--crim:#a3153e;--crim2:#7d0f2e;--gold:#e0b44c;--cream:#fff6dc;--ink:#4a0b1c;--green:#2e7d32;--bg:#fbeecb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#3a0a19;--cream:#fff0c8}}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;font-family:'Cairo',Tahoma,sans-serif;background:var(--bg);color:var(--ink);
background-image:radial-gradient(circle at 20% 10%,#ffffff55 0 2px,transparent 3px),linear-gradient(135deg,transparent 48%,#e0b44c22 49% 51%,transparent 52%);background-size:36px 36px,36px 36px}
header{background:var(--crim);color:var(--cream);text-align:center;padding:10px 8px 14px;border-bottom:5px solid var(--gold);position:relative}
header:after{content:"";position:absolute;inset:auto 0 -12px;height:8px;background:repeating-linear-gradient(90deg,var(--green) 0 14px,#fff 14px 28px,var(--crim2) 28px 42px);opacity:.9}
h1{margin:0;font-size:24px;font-weight:900;letter-spacing:.5px}
header small{opacity:.9;font-weight:500}
main{max-width:520px;margin:18px auto 30px;padding:0 12px;text-align:center}
button{font-family:inherit;cursor:pointer}
.btn{background:var(--crim);color:var(--cream);border:3px solid var(--gold);border-radius:16px;padding:10px 20px;font-size:19px;font-weight:700;box-shadow:0 4px 0 var(--crim2)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--crim2)}
.btn.ok{background:var(--green);box-shadow:0 4px 0 #1b5e20}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:8px;margin:10px 0}
.team{background:var(--cream);border:3px solid #d9cbb0;border-radius:14px;padding:6px 4px;color:var(--ink);font-weight:700;font-size:14px;transition:.25s}
.team.on{border-color:var(--c);box-shadow:0 0 0 4px var(--c)44,0 6px 14px #0003;transform:scale(1.05)}
.team svg{height:62px;display:block;margin:0 auto}
.tip{font-size:17px;font-weight:700;margin:8px 0}
.turn{display:inline-block;background:var(--c);color:#fff;padding:6px 18px;border-radius:30px;font-size:20px;font-weight:900;border:3px solid var(--gold)}
.deck{position:relative;width:150px;height:225px;margin:14px auto;border-radius:14px;border:5px solid var(--gold);overflow:hidden;background:linear-gradient(90deg,#db161b 0 28%,transparent 28%),linear-gradient(180deg,#fff 0 33.4%,#db161b 33.4% 66.7%,#008000 66.7%);animation:bob 1.6s ease-in-out infinite;cursor:pointer;box-shadow:0 8px 0 #0004}.deck::before{content:"\2694\FE0E";position:absolute;left:0;top:50%;width:28%;transform:translateY(-50%);color:#fff;font-size:30px;text-align:center}
@keyframes bob{50%{transform:translateY(-8px) rotate(-2deg)}}
.cw{--w:min(66vw,270px);width:var(--w);margin:10px auto;border-radius:14px;overflow:hidden;border:4px solid var(--gold);box-shadow:0 8px 20px #0004;height:calc(var(--w)*1.5*.77);transition:height .6s ease;background:var(--cream)}
.cw.full{height:calc(var(--w)*1.5)}
.cw img{width:100%;display:block}
.fb{height:100%;aspect-ratio:2/3;display:flex;flex-direction:column;justify-content:center;gap:8px;font-size:22px;font-weight:900;background:linear-gradient(var(--cream),#ffe9a8)}
.fb b{font-size:70px}
.sp{background:radial-gradient(circle,#ffe58a,#e0b44c);height:100%;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:10px;font-weight:900;font-size:21px}
.sp b{font-size:56px}
.bar{height:12px;background:#0002;border-radius:8px;overflow:hidden;width:min(66vw,270px);margin:6px auto}
.bar i{display:block;height:100%;width:100%;background:var(--green);transition:width 1s linear}
.ans{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.ans .btn{padding:10px 2px;font-size:16px}
.ans .btn span{display:block;font-size:28px}
.msg{font-size:21px;font-weight:900;margin:8px 0}
.good{color:var(--green)}.bad{color:var(--crim)}
.say{background:var(--cream);border:2px dashed var(--crim);border-radius:12px;padding:8px;font-weight:700}
.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.25)}}
.conf{position:fixed;top:-40px;font-size:28px;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.deck,.pop,.conf{animation:none}}
</style>
</head>
<body>
<header><h1>🌴 لعبة التعاون 🏰</h1><small>المؤمن للمؤمن · ابنوا بيت التعاون قبل الجميع!</small></header>
<main id="m"></main>
<footer style="text-align:center;padding:12px 8px 22px;font-weight:900;font-size:20px;color:var(--crim)">🌴 مروي الغاربية 🌴</footer>

const win=()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.2),i*140));
function body(n,c){const f=(i,k)=>i<n?k:'#e6dcc6',a='stroke="#0004" stroke-width="1"';
return `<svg viewBox="0 0 80 100"><g transform="translate(10,0)"><rect x="6" y="88" width="48" height="8" rx="2" fill="${f(0,'#8d6e63')}" ${a}/><rect x="10" y="48" width="40" height="40" fill="${f(1,'#f3dfb0')}" ${a}/><path d="M24 88V68a6 6 0 0 1 12 0V88Z" fill="${f(2,'#6d4c41')}" ${a}/><rect x="40" y="56" width="7" height="10" rx="3.5" fill="${f(3,'#81d4fa')}" ${a}/><path d="M8 48V34H16V40H24V34H36V40H44V34H52V48Z" fill="${f(4,c)}" ${a}/><rect x="29" y="8" width="2" height="26" fill="${f(5,'#6d4c41')}"/><path d="M31 8H47V20H31Z" fill="${f(5,c)}" ${a}/></g><g><rect x="25.5" y="52" width="1" height="6" fill="${f(6,'#6d4c41')}"/><rect x="24" y="58" width="4" height="8" rx="2" fill="${f(6,'#ffb300')}" ${a}/></g><g><rect x="7" y="58" width="4" height="36" rx="1.5" fill="${f(7,'#8d6e63')}" ${a}/><ellipse cx="9" cy="56" rx="9" ry="3" transform="rotate(-30 9 56)" fill="${f(7,'#2e7d32')}" ${a}/><ellipse cx="9" cy="56" rx="9" ry="3" transform="rotate(30 9 56)" fill="${f(7,'#388e3c')}" ${a}/><ellipse cx="9" cy="54" rx="9" ry="3" fill="${f(7,'#43a047')}" ${a}/></g><g fill="${f(8,'#a1887f')}" ${a}><rect x="64" y="78" width="3" height="16"/><rect x="69" y="78" width="3" height="16"/><rect x="74" y="78" width="3" height="16"/><rect x="63" y="83" width="15" height="2.5"/></g><g><circle cx="24" cy="85" r="2.5" fill="${f(9,'#ec407a')}"/><circle cx="29" cy="86" r="2.5" fill="${f(9,'#ffca28')}"/><circle cx="52" cy="86" r="2.5" fill="${f(9,'#ec407a')}"/><circle cx="57" cy="85" r="2.5" fill="${f(9,'#ffca28')}"/></g></svg>`}
function boardH(){return `<div class="board">`+S.teams.map((t,i)=>`<div class="team ${i==S.turn&&S.ph!='win'?'on':''}" id="t${i}" style="--c:${t.c}">${body(t.p,t.c)}${t.e} ${t.n}<br>${t.p}/10</div>`).join('')+`</div>`}
function setup(){clearInterval(tm);S={ph:'setup'};M.innerHTML=`<p class="tip">كم فريق سيلعب؟</p><div class="row">${[2,3,4].map(n=>`<button class="btn" onclick="start(${n})">${n} فرق</button>`).join('')}</div><p>أجيبوا عن الموقف: هل هو <b>تراحم</b> أم <b>توادّ</b> أم <b>تعاطف</b>؟ كل إجابة صحيحة تمنح فريقكم قطعة من البيت. أول فريق يكمل بيته يفوز!</p><div class="row" style="font-size:40px">❤️ 🤝 👀</div>`}
function start(n){S={ph:'ready',turn:0,teams:TEAMS.slice(0,n).map(([n,e,c])=>({n,e,c,p:0}))};deck=[];render()}
function render(){const t=S.teams[S.turn];let h=boardH();
if(S.ph=='ready')h+=`<span class="turn" style="--c:${t.c}">دور فريق ${t.n} ${t.e}</span><p class="tip">اسحبوا بطاقة!</p><div class="deck" onclick="draw()"></div>`;
M.innerHTML=h}
function cardH(c,full){let inner=c.sp?`<div class="sp"><b>🧍‍♂️</b>كلنا جسد واحد!<span style="font-size:17px">${S.sp}</span></div>`:c.fb?`<div class="fb"><b>${c.e}</b>${c.x}</div>`:`<img src="${IMGS[c.i]}" alt="">`;
return `<div class="cw ${full?'full':''}" id="cw">${inner}</div>`}
function draw(){if(!deck.length)deck=sh([0,1,2,3,4,5,6,7,8]);S.c=CARDS[deck.pop()];S.sp=SPECIAL[Math.floor(Math.random()*3)];S.ph='card';S.left=20;beep(520);
const t=S.teams[S.turn],c=S.c;
M.innerHTML=boardH()+`<span class="turn" style="--c:${t.c}">دور فريق ${t.n} ${t.e}</span>`+cardH(c,c.sp)+(c.sp?`<p class="say">الجميع يجيب شفويًا ثم يحكم المعلم</p><div class="row"><button class="btn ok" onclick="special(1)">أجاب الجميع ✅ قطعة للكل</button><button class="btn" onclick="special(0)">لم يتفقوا ❌</button></div>`:`<div class="bar"><i id="bar"></i></div><p class="tip">ما نوع الموقف؟</p><div class="ans">${TYPES.map((x,i)=>`<button class="btn" onclick="ans(${i})"><span>${x[1]}</span>${x[0]}</button>`).join('')}</div>`);
if(!c.sp){setTimeout(()=>{const b=$('#bar');if(b)b.style.width='0'},50);clearInterval(tm);tm=setInterval(()=>{if(--S.left<=0){clearInterval(tm);ans(-1)}else if(S.left<=5)beep(300,.06,'square')},1000)}}
function ans(i){clearInterval(tm);const c=S.c,t=S.teams[S.turn],ok=i==c.t;if(ok){t.p++;win()}else beep(160,.35,'sawtooth');
M.innerHTML=boardH()+`<span class="turn" style="--c:${t.c}">فريق ${t.n} ${t.e}</span>`+cardH(c,0)+`<div class="msg ${ok?'good':'bad'}">${ok?'أحسنتم! 🎉 حصلتم على '+PARTS[t.p-1]:(i<0?'انتهى الوقت ⏰ ':'ليست هذه ')+'الإجابة: '+TYPES[c.t][1]+' '+TYPES[c.t][0]}</div><p class="say">قولوا شفويًا: ماذا ستفعلون في هذا الموقف؟</p><button class="btn" onclick="next()">التالي ◀</button>`;
setTimeout(()=>{const w=$('#cw');if(w)w.classList.add('full')},100);S.ph='result'}
function special(ok){if(ok){S.teams.forEach(t=>t.p=Math.min(10,t.p+1));win()}else beep(160,.35,'sawtooth');next()}
function next(){const w=S.teams.filter(t=>t.p>=10);if(w.length)return end(w);S.turn=(S.turn+1)%S.teams.length;S.ph='ready';render()}
function end(w){S.ph='win';win();M.innerHTML=boardH()+`<div class="msg pop" style="font-size:30px">🏆 ${w.map(t=>t.e+' فريق '+t.n).join(' و ')}</div><p class="tip">أكملتم بيت التعاون! تهانينا 🎉</p><button class="btn" onclick="setup()">العب مرة أخرى</button>`;
for(let i=0;i<40;i++){const s=document.createElement('span');s.className='conf';s.textContent=['⭐','🌴','🎉','❤️'][i%4];s.style.left=Math.random()*100+'vw';s.style.animationDuration=(2+Math.random()*2)+'s';s.style.animationDelay=Math.random()+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),5000)}}
setup();
</script>
</body>
</html>
